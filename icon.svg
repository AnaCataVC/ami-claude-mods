<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7" />
      <stop offset="50%" stop-color="#f38ba8" />
      <stop offset="100%" stop-color="#fab387" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#bgGrad)" stroke="#313244" stroke-width="2" />
  
  <!-- Terminal Prompt Symbol & Modular Blocks -->
  <path d="M 32 38 L 52 58 L 32 78" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="58" y1="78" x2="84" y2="78" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" />
  
  <!-- Extension Blocks (Mods) -->
  <rect x="68" y="32" width="22" height="22" rx="6" fill="#89b4fa" fill-opacity="0.85" filter="url(#glow)" />
  <path d="M 79 38 L 79 48 M 74 43 L 84 43" stroke="#11111b" stroke-width="3" stroke-linecap="round" />
</svg>
